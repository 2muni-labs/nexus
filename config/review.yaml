version: 1

severity:
  P0: Rare critical issue with destructive mutation, data loss, security compromise, uncontrolled destructive Git behavior, or fundamental orchestration corruption.
  P1: Meaningful correctness or operational risk, including ownership/isolation errors, capability bypass, invalid integration baseline, or false validation PASS.
  P2: Maintainability, testability, developer-experience, or design issue.
  P3: Optional improvement with low urgency.

findings:
  standard:
    required:
      - id
      - severity
      - repository
      - area
      - evidence
      - problem
      - impact
      - recommendation
      - confidence
      - observed_behavior
      - expected_behavior
      - recommendation_reason
      - trade_off
  cross-repository:
    required:
      - id
      - severity
      - owner
      - affected_repository
      - contract
      - evidence
      - problem
      - impact
      - recommendation
      - confidence
      - observed_behavior
      - expected_behavior
      - recommendation_reason
      - trade_off
    implementation-owner-count: 1

framework:
  governing_document: docs/review-principles.md
  applies_to: all_substantive_reviews_confirmations_and_self_reviews
  finding_extensions_apply_to: new_reports_only

finding_extensions:
  routing:
    required:
      - required_capability
      - selected_agent_profile
      - fallback_behavior
      - validation_impact

conventions:
  id: Stable identifier, for example BASECAMP-001 or CONTRACT-001.
  repository: Logical key from repositories.yaml.
  owner: Exactly one logical repository key; split multi-owner fixes into separate findings/tasks.
  affected_repository: One consumer repository key; split additional affected contracts as needed.
  evidence: Revision plus file/line, test, or reproducible observation; label unverified assumptions.
  confidence: high, medium, or low, with a brief justification.
  decisions: accepted, deferred, or rejected, each with rationale.

validation:
  required_for:
    - P0
    - P1
    - high-risk
    - critical-complexity
    - architecture-sensitive
    - integration-with-multiple-upstream-mutations
  independent_session: true
  results: [PASS, FAIL, NEEDS-WORK]
  P2: risk-based
  P3: record-only-by-default

implementation_decisions:
  P0: required
  P1: normally-required
  P2: benefit-must-clearly-exceed-complexity
  P3: record-only-by-default
  final_gate: human-review-required
