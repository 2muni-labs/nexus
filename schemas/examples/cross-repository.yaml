    id: "R1"
    title: "Review host producer contract"
    type: "review"
    complexity: "medium"
    risk: "low"
    context_size: "medium"
    parallelizable: true
    repository: "basecamp"
    dependencies: []
    mutation_scope: {"mode": "read-only", "targets": ["explicit-scope-to-be-inspected"], "do_not_touch": ["other repositories", "source/main branches", "unrelated user changes"]}
    base: {"source": "initial", "ref": "REPLACE_WITH_IMMUTABLE_REF_OR_EXACT_PATCH_DIGEST"}
    acceptance: ["Replace with task-specific observable acceptance before dispatch"]
    architecture_sensitive: false
    routing:
      task_class: "independent-review"
      agent: "antigravity"
      fallback_agent: "codex"
      model_profile: "deep"
      effort: "high"
      reasons: ["Draft capability intent; verify before dispatch"]
      validation: {"required": false, "independent_session": false, "preferred_agent": "antigravity"}
      resolution: {"status": "pending", "model": null, "effort": null}
