# Draft only. Host-owned fix is hypothetical; reject if evidence does not justify it.
# Validator consumes normalized Foundry contract evidence; no cross-repository mutation.
version: 1
objective: "Review host/runtime contract and fix only its owning repository"
mode: "ORCHESTRATED"
repositories: ["nexus", "basecamp", "foundry"]
requirements: ["Preserve isolated ownership and compatibility", "All candidate changes pass observable tests and human review"]
baselines:
  nexus: {"ref": "REPLACE_WITH_IMMUTABLE_REVISION", "scope": "committed snapshot", "dirty_state": "exclude and preserve; record inspected changes"}
  basecamp: {"ref": "REPLACE_WITH_IMMUTABLE_REVISION", "scope": "committed snapshot", "dirty_state": "exclude and preserve; record inspected changes"}
  foundry: {"ref": "REPLACE_WITH_IMMUTABLE_REVISION", "scope": "committed snapshot", "dirty_state": "exclude and preserve; record inspected changes"}
tasks:
