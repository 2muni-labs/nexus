name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Nexus tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check test prerequisites
        shell: bash
        run: |
          for tool in bash git jq python3; do
            command -v "$tool"
          done
      - name: Run offline test suite
        shell: bash
        run: bash tests/run.sh
